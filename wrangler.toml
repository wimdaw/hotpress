# Workers 模式配置（本地开发 / wrangler deploy 直部）
# Pages 模式见 wrangler.pages.toml（wrangler pages deploy --config wrangler.pages.toml）
name = "hotpress"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# 每日 00:30 UTC（北京时间 08:30）自动运行流水线；仅 Workers 部署生效，
# Pages 部署请用外部定时器调 POST /api/cron/run（带 X-CRON-Secret）
[triggers]
crons = ["30 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hotpress-db"
database_id = "a1cd23c7-c9f1-43e2-a9e9-77224cd3f959"
